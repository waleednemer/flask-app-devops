<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flask DevOps</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #7c3aed);
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .version {
            display: inline-block;
            padding: 10px 20px;
            background: #22c55e;
            border-radius: 30px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .status {
            font-size: 16px;
            color: #d1fae5;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>DevOps Pipeline 🚀</h1>

        <p>Flask + Docker + GitHub</p>

        <div class="version">
            Version 7
        </div>

        <div class="status">
            Deployment Ready ✅
        </div>

    </div>

</body>
</html>
