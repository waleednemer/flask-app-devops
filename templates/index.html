<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flask DevOps Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #020617, #4c1d95);
            color: white;
            padding: 20px;
        }

        .container {
            width: 700px;
            max-width: 100%;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
        }

        h1 {
            font-size: 46px;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 19px;
            color: #d1d5db;
            margin-bottom: 35px;
        }

        .version {
            display: inline-block;
            padding: 10px 24px;
            background: #22c55e;
            border-radius: 30px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .services {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .service {
            background: rgba(255, 255, 255, 0.08);
            padding: 22px 10px;
            border-radius: 15px;
        }

        .service h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .service p {
            font-size: 14px;
            color: #bbf7d0;
        }

        .status {
            padding: 15px;
            border-radius: 12px;
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            font-weight: bold;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #9ca3af;
        }

        @media (max-width: 600px) {
            .services {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 36px;
            }

            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>DevOps Dashboard 🚀</h1>

        <p class="subtitle">
            Flask Application CI/CD Pipeline
        </p>

        <div class="version">
            Version 8
        </div>

        <div class="services">

            <div class="service">
                <h3>Flask</h3>
                <p>Running ✅</p>
            </div>

            <div class="service">
                <h3>Docker</h3>
                <p>Containerized ✅</p>
            </div>

            <div class="service">
                <h3>GitHub</h3>
                <p>Connected ✅</p>
            </div>

        </div>

        <div class="status">
            Deployment Successful 🚀
        </div>

        <div class="footer">
            Flask + Docker + GitHub Actions
        </div>

    </div>

</body>
</html>
