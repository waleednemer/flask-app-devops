name: Flask CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test Flask Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile app.py

      - name: Test Flask import
        run: |
          python -c "from app import app; print('Flask application loaded successfully')"


  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ secrets.DOCKER_USERNAME }}/flask-app-devops:latest" .

      - name: Push Docker image
        run: |
          docker push "${{ secrets.DOCKER_USERNAME }}/flask-app-devops:latest"


  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/flask-app-devops

            echo "Pulling latest Docker image..."
            docker compose pull

            echo "Starting updated application..."
            docker compose up -d

            echo "Deployment completed successfully!"

            echo "Container status:"
            docker compose ps

